<script>

function stepper(){var s=el('<div class="p3-step"><button type="button" aria-label="Less">−</button><input type="number" inputmode="numeric" min="1" max="999" value="1" aria-label="Quantity"><button type="button" aria-label="More">+</button></div>');var i=s.querySelector("input"),b=s.querySelectorAll("button");var ch=function(){if(s.onchg)s.onchg(s.val())};b[0].onclick=function(){i.value=Math.max(1,(parseInt(i.value,10)||1)-1);ch()};b[1].onclick=function(){i.value=Math.min(999,(parseInt(i.value,10)||1)+1);ch()};i.addEventListener("input",ch);s.val=function(){return Math.max(1,Math.min(999,parseInt(i.value,10)||1))};return s}

 sh.querySelector(".p3-sh b").textContent=name;sh.querySelector(".p3-sh small").textContent=sku||"";D.body.appendChild(bg);D.body.appendChild(sh);requestAnimationFrame(function(){bg.classList.add("open");sh.classList.add("open")});

}catch(e){}})();
